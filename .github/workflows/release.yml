name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build kpi.sh and checksum
        run: make checksum
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kpi.sh
            kpi.sh.sha256
