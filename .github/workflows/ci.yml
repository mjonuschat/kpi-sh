name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make shellcheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash-version: ["4.0", "5.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run unit tests (bash ${{ matrix.bash-version }})
        run: |
          # The bash images are minimal Alpine: no git or python3 (needed by
          # git/json/klipper tests), busybox instead of GNU coreutils (Pi
          # hosts have GNU), and bash only at /usr/local/bin (test fakes use
          # #!/bin/bash). Run as non-root: permission-based cases skip as root.
          docker run --rm -v "$PWD:/work" -w /work bash:${{ matrix.bash-version }} bash -c "
            apk add --no-cache git python3 coreutils
            ln -sf /usr/local/bin/bash /bin/bash
            adduser -D tester
            su tester -s /bin/bash -c 'test/bats-core/bin/bats \$(ls test/*.bats | grep -v integration.bats)'
          "
      - name: Build kpi.sh
        run: make kpi.sh
      - name: Verify clean rebuild
        run: |
          sha1="$(sha256sum dist/kpi.sh)"
          make clean
          make kpi.sh
          sha2="$(sha256sum dist/kpi.sh)"
          [ "$sha1" = "$sha2" ] || (echo "rebuild is not clean" && exit 1)
      - name: Run integration tests
        run: make test-integration

  test-root:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install git (required before checkout — debian:bookworm ships neither)
        # actions/checkout@v4 needs git for `submodules: recursive`; without
        # it, checkout falls back to a REST-API tarball download that does
        # not support submodule recursion and hard-errors.
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install bats dependencies
        # python3 because require_python_min's test calls `command -v
        # python3` and the bare debian:bookworm image does not include it
        # by default.
        run: apt-get update && apt-get install -y python3
      - name: Run preflight.bats as root
        run: test/bats-core/bin/bats test/preflight.bats
