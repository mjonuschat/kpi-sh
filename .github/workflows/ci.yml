name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make shellcheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bash-version: ["4.0", "5.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run unit tests (bash ${{ matrix.bash-version }})
        run: |
          if [ "${{ matrix.bash-version }}" = "4.0" ]; then
            # bash:4.0 is a minimal Alpine-based image with neither git nor
            # python3 — both are required by git.bats/json.bats/klipper.bats,
            # so install them (via apk, not apt-get) before running the suite.
            docker run --rm -v "$PWD:/work" -w /work bash:4.0 bash -c "
              apk add --no-cache git python3
              test/bats-core/bin/bats \$(ls test/*.bats | grep -v integration.bats)
            "
          else
            make test-unit
          fi
      - name: Build kpi.sh
        run: make kpi.sh
      - name: Verify clean rebuild
        run: |
          sha1="$(sha256sum kpi.sh)"
          rm kpi.sh
          make kpi.sh
          sha2="$(sha256sum kpi.sh)"
          [ "$sha1" = "$sha2" ] || (echo "rebuild is not clean" && exit 1)
      - name: Run integration tests
        run: make test-integration

  test-root:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install git (required before checkout — debian:bookworm ships neither)
        # actions/checkout@v4 needs git for `submodules: recursive`; without
        # it, checkout falls back to a REST-API tarball download that does
        # not support submodule recursion and hard-errors.
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install bats dependencies
        # python3 because require_python_min's test calls `command -v
        # python3` and the bare debian:bookworm image does not include it
        # by default.
        run: apt-get update && apt-get install -y python3
      - name: Run preflight.bats as root
        run: test/bats-core/bin/bats test/preflight.bats
